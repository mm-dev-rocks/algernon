flutter_launcher_icons:
  android: true
  image_path: "assets/icon/algernon-icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/algernon-icon-foreground.png"
  adaptive_icon_monochrome: "assets/icon/algernon-icon-monochrome.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

  ios: true
  # image_path_ios: "assets/icon/icon.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/icon/algernon-icon-dark-transparent.png"
  image_path_ios_tinted_grayscale: "assets/icon/algernon-icon-monochrome.png"
  # desaturate_tinted_to_grayscale_ios: true
  # background_color_ios: "#ffffff"

  web:
    generate: true
    image_path: "assets/icon/algernon-icon.png"
    background_color: "#320038"
    theme_color: "#320038"
  windows:
    generate: true
    image_path: "assets/icon/algernon-icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/algernon-icon.png"
